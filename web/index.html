<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MUSIX</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MUSIX" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #181818;
      --surface2: #232323;
      --accent: #a855f7;
      --accent2: #7c3aed;
      --text: #ffffff;
      --muted: #a0a0a0;
      --radius: 14px;
    }

    html, body {
      height: 100%; background: var(--bg);
      font-family: 'Inter', sans-serif; color: var(--text);
      overflow: hidden; user-select: none;
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100dvh; }

    /* ── Screens ── */
    .screen { display: none; flex: 1; overflow-y: auto; padding: 0 0 8px; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── Header ── */
    .header {
      padding: 56px 20px 16px;
      background: linear-gradient(180deg, #1a0a2e 0%, transparent 100%);
    }
    .header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .header h1 span { color: var(--accent); }
    .header p { color: var(--muted); font-size: 13px; margin-top: 2px; }

    /* ── Search Bar ── */
    .search-wrap { padding: 0 16px 12px; }
    .search-box {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2); border-radius: 50px;
      padding: 12px 18px; border: 1.5px solid transparent;
      transition: border-color 0.2s;
    }
    .search-box:focus-within { border-color: var(--accent); }
    .search-box svg { flex-shrink: 0; opacity: 0.5; }
    .search-box input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 15px; font-family: inherit;
    }
    .search-box input::placeholder { color: var(--muted); }
    .search-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 50px; color: #fff;
      padding: 10px 22px; font-size: 14px; font-weight: 600;
      cursor: pointer; white-space: nowrap; font-family: inherit;
      transition: transform 0.15s, opacity 0.15s;
    }
    .search-btn:active { transform: scale(0.96); opacity: 0.85; }

    /* ── Status ── */
    .status-label {
      text-align: center; color: var(--muted); font-size: 13px;
      padding: 4px 16px; min-height: 22px;
    }

    /* ── Song List ── */
    .song-list { padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .song-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border-radius: var(--radius);
      padding: 10px 14px; cursor: pointer;
      transition: background 0.15s, transform 0.12s;
      border: 1px solid transparent;
    }
    .song-card:active { transform: scale(0.98); background: var(--surface2); }
    .song-card.playing { border-color: var(--accent); background: #1e0a33; }
    .song-thumb {
      width: 48px; height: 48px; border-radius: 8px;
      object-fit: cover; flex-shrink: 0; background: var(--surface2);
    }
    .song-info { flex: 1; min-width: 0; }
    .song-title {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 12px; color: var(--muted); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .song-dur { font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .fav-btn {
      background: none; border: none; cursor: pointer;
      padding: 4px; color: var(--muted); flex-shrink: 0;
      transition: color 0.2s, transform 0.15s;
    }
    .fav-btn.active { color: #f43f5e; }
    .fav-btn:active { transform: scale(1.3); }

    /* ── Featured / Home Cards ── */
    .section-title {
      font-size: 18px; font-weight: 700; padding: 4px 16px 8px;
    }
    .genre-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; padding: 0 12px 12px;
    }
    .genre-card {
      border-radius: var(--radius); padding: 20px 14px;
      cursor: pointer; position: relative; overflow: hidden;
      min-height: 90px; display: flex; align-items: flex-end;
      transition: transform 0.15s;
    }
    .genre-card:active { transform: scale(0.97); }
    .genre-card span { font-size: 15px; font-weight: 700; position: relative; z-index: 1; }

    /* ── Mini Player ── */
    #mini-player {
      background: linear-gradient(135deg, #1a0a2e, #0d0d0d);
      border-top: 1px solid #2a2a2a; padding: 10px 16px 10px;
      display: none; align-items: center; gap: 12px;
      cursor: pointer; flex-shrink: 0;
    }
    #mini-player.visible { display: flex; }
    #mini-thumb {
      width: 44px; height: 44px; border-radius: 8px;
      object-fit: cover; flex-shrink: 0; background: var(--surface2);
    }
    #mini-info { flex: 1; min-width: 0; }
    #mini-title {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #mini-artist { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .mini-controls { display: flex; gap: 6px; align-items: center; }
    .ctrl-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text); padding: 6px; border-radius: 50%;
      transition: background 0.15s, transform 0.12s;
      display: flex; align-items: center; justify-content: center;
    }
    .ctrl-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }
    .play-btn-mini {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      width: 38px; height: 38px;
    }

    /* ── Full Player ── */
    #full-player {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg);
      display: none; flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #full-player.open { display: flex; transform: translateY(0); }
    .player-drag-handle {
      width: 40px; height: 4px; background: #333;
      border-radius: 2px; margin: 12px auto 0;
    }
    .player-bg {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 16px 24px 20px; overflow-y: auto;
      background: radial-gradient(ellipse at 50% 0%, #2d0a66 0%, var(--bg) 70%);
    }
    #full-thumb {
      width: min(280px, 72vw); height: min(280px, 72vw);
      border-radius: 20px; object-fit: cover;
      background: var(--surface2); margin: 20px 0;
      box-shadow: 0 24px 60px rgba(168,85,247,0.35);
    }
    #full-title {
      font-size: 22px; font-weight: 800; text-align: center;
      margin-bottom: 6px; width: 100%;
    }
    #full-artist { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 20px; }
    
    #fav-toggle {
      position: absolute; top: 24px; right: 24px;
      background: none; border: none; cursor: pointer;
      color: var(--muted); padding: 8px;
      transition: color 0.2s, transform 0.15s;
    }
    #fav-toggle.active { color: #f43f5e; }
    #fav-toggle:active { transform: scale(1.3); }

    /* Progress */
    .progress-wrap { width: 100%; margin-bottom: 8px; }
    #progress-bar {
      width: 100%; height: 4px; background: #333;
      border-radius: 2px; cursor: pointer; appearance: none;
      -webkit-appearance: none; outline: none;
    }
    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      background: var(--accent); border-radius: 50%; cursor: pointer;
    }
    #progress-bar::-moz-range-thumb {
      width: 14px; height: 14px; background: var(--accent);
      border-radius: 50%; cursor: pointer; border: none;
    }
    #progress-bar { accent-color: var(--accent); }
    .time-row {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--muted); margin-bottom: 20px; width: 100%;
    }
    .player-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; width: 100%; margin-bottom: 16px;
    }
    .play-btn-full {
      width: 66px; height: 66px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    #loading-ring {
      width: 66px; height: 66px; display: none;
      border: 3px solid #333; border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Volume */
    .volume-wrap { display: flex; align-items: center; gap: 10px; width: 100%; }
    .volume-wrap svg { color: var(--muted); flex-shrink: 0; }
    #volume-bar {
      flex: 1; height: 4px; accent-color: var(--accent);
      cursor: pointer; appearance: none; -webkit-appearance: none;
      background: #333; border-radius: 2px;
    }
    #volume-bar::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      background: var(--accent); border-radius: 50%;
    }

    /* ── Bottom Nav ── */
    #bottom-nav {
      display: flex; background: #111; border-top: 1px solid #222;
      padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 3px; padding: 10px 0 8px;
      cursor: pointer; transition: color 0.15s; color: var(--muted);
      border: none; background: none; font-family: inherit;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item span { font-size: 10px; font-weight: 500; }

    /* ── Spinner ── */
    .spinner {
      width: 32px; height: 32px; border: 3px solid #333;
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 40px auto;
    }

    /* ── Library ── */
    .empty-state {
      text-align: center; padding: 60px 24px; color: var(--muted);
    }
    .empty-state svg { opacity: 0.3; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }
  </style>
</head>
<body>
<div id="app">

  <!-- ───── HOME ───── -->
  <div class="screen active" id="screen-home">
    <div class="header">
      <h1>Good <span id="greeting-time">Evening</span> 👋</h1>
      <p>What are you in the mood for?</p>
    </div>
    <div class="section-title">Browse by mood</div>
    <div class="genre-grid" id="genre-grid"></div>
    <div class="section-title">Trending</div>
    <div class="status-label" id="home-status">Loading trending songs...</div>
    <div class="song-list" id="home-list"></div>
  </div>

  <!-- ───── SEARCH ───── -->
  <div class="screen" id="screen-search">
    <div class="header" style="padding-bottom:8px;">
      <h1>Search</h1>
      <p>Find any song on YouTube</p>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="search" placeholder="Songs, artists, albums..." 
               autocomplete="off" enterkeyhint="search"
               onkeydown="if(event.key==='Enter') doSearch()" />
        <button class="search-btn" onclick="doSearch()">Search</button>
      </div>
    </div>
    <div class="status-label" id="search-status"></div>
    <div class="song-list" id="search-list"></div>
  </div>

  <!-- ───── LIBRARY ───── -->
  <div class="screen" id="screen-library">
    <div class="header">
      <h1>Your <span style="color:var(--accent)">Library</span></h1>
      <p>Your favourited songs</p>
    </div>
    <div class="song-list" id="library-list"></div>
    <div class="empty-state" id="library-empty" style="display:none">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <p>Tap ♥ on any song to save it here</p>
    </div>
  </div>

  <!-- ───── MINI PLAYER ───── -->
  <div id="mini-player" onclick="openFullPlayer()">
    <img id="mini-thumb" src="" alt="" />
    <div id="mini-info">
      <div id="mini-title">Not playing</div>
      <div id="mini-artist"></div>
    </div>
    <div class="mini-controls" onclick="event.stopPropagation()">
      <button class="ctrl-btn" onclick="prevSong()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn-mini" id="mini-play-btn" onclick="togglePlay()">
        <svg id="mini-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="nextSong()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- ───── FULL PLAYER ───── -->
  <div id="full-player">
    <button onclick="closeFullPlayer()" style="position:absolute;top:18px;left:16px;background:none;border:none;color:#fff;cursor:pointer;padding:8px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <button id="fav-toggle" onclick="toggleFav()">
      <svg id="fav-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
    <div class="player-drag-handle"></div>
    <div class="player-bg">
      <img id="full-thumb" src="" alt="" />
      <div id="full-title">Not playing</div>
      <div id="full-artist"></div>
      <div class="progress-wrap">
        <input type="range" id="progress-bar" min="0" max="100" value="0" 
               oninput="seekTo(this.value)" />
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-total">0:00</span>
      </div>
      <div class="player-controls">
        <button class="ctrl-btn" onclick="prevSong()">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <div id="loading-ring"></div>
        <button class="ctrl-btn play-btn-full" id="full-play-btn" onclick="togglePlay()">
          <svg id="full-play-icon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" onclick="nextSong()">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="volume-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)" />
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM16.5 3v2.03c2.89.86 5 3.54 5 6.72s-2.11 5.86-5 6.72V20.5c4.04-.91 7-4.49 7-8.75s-2.96-7.84-7-8.75z"/></svg>
      </div>
    </div>
  </div>

  <!-- ───── BOTTOM NAV ───── -->
  <nav id="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home',this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="switchTab('search',this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </button>
    <button class="nav-item" onclick="switchTab('library',this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span>Favourites</span>
    </button>
  </nav>
</div>

<!-- Hidden audio element -->
<audio id="audio" preload="none"></audio>

<script>
const BASE = "https://musix-mfqx.onrender.com";
const audio = document.getElementById("audio");

// ── State ──
let queue = [], qIndex = 0, currentSong = null;
let favourites = JSON.parse(localStorage.getItem("musix_favs") || "[]");
let homeResults = {};

// ── Greeting ──
const h = new Date().getHours();
document.getElementById("greeting-time").textContent =
  h < 12 ? "Morning" : h < 17 ? "Afternoon" : "Evening";

// ── Genres ──
const genres = [
  {label:"Pop Hits",    q:"pop hits 2025",          bg:"linear-gradient(135deg,#a855f7,#6366f1)"},
  {label:"Lofi",        q:"lofi hip hop chill",      bg:"linear-gradient(135deg,#0ea5e9,#2563eb)"},
  {label:"Tamil",       q:"tamil hits 2025",         bg:"linear-gradient(135deg,#f43f5e,#e11d48)"},
  {label:"Hip Hop",     q:"hip hop rap 2025",        bg:"linear-gradient(135deg,#f97316,#dc2626)"},
  {label:"Romantic",    q:"romantic love songs",     bg:"linear-gradient(135deg,#ec4899,#f43f5e)"},
  {label:"Workout",     q:"workout gym music 2025",  bg:"linear-gradient(135deg,#22c55e,#16a34a)"},
];
const grid = document.getElementById("genre-grid");
genres.forEach(g => {
  const el = document.createElement("div");
  el.className = "genre-card";
  el.style.background = g.bg;
  el.innerHTML = `<span>${g.label}</span>`;
  el.onclick = () => { switchTab("search", document.querySelectorAll(".nav-item")[1]); searchFor(g.q); };
  grid.appendChild(el);
});

// ── Tab Switching ──
function switchTab(tab, btn) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + tab).classList.add("active");
  document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  if (tab === "library") renderLibrary();
}

// ── Wake-up ping: keeps retrying until backend responds ──
async function wakeBackend(onStatus) {
  const MAX_WAIT = 90000; // 90 seconds max
  const POLL = 3000;
  const start = Date.now();
  let attempt = 0;
  while (Date.now() - start < MAX_WAIT) {
    try {
      const res = await fetch(`${BASE}/`, { signal: AbortSignal.timeout(5000) });
      if (res.ok) return true;
    } catch(_) {}
    attempt++;
    const waited = Math.round((Date.now() - start) / 1000);
    onStatus(`Waking up server… ${waited}s`);
    await new Promise(r => setTimeout(r, POLL));
  }
  return false;
}

// ── Home: load trending on start ──
async function loadHome() {
  const listEl = document.getElementById("home-list");
  const statusEl = document.getElementById("home-status");
  listEl.innerHTML = '<div class="spinner"></div>';
  statusEl.textContent = "Connecting…";

  // First, make sure backend is awake
  const alive = await wakeBackend(msg => { statusEl.textContent = msg; });
  if (!alive) {
    statusEl.textContent = "Server unavailable. Please try again later.";
    listEl.innerHTML = "";
    return;
  }

  statusEl.textContent = "Loading trending…";
  try {
    const res = await fetch(`${BASE}/songs/search?q=trending+music+2025`);
    const songs = await res.json();
    homeResults = songs;
    statusEl.textContent = "";
    listEl.innerHTML = "";
    songs.forEach((s, i) => listEl.appendChild(makeSongCard(s, i, songs)));
  } catch(e) {
    statusEl.textContent = "Failed to load trending. Tap a genre or search for a song.";
    listEl.innerHTML = "";
  }
}


// ── Search ──
async function doSearch() {
  const q = document.getElementById("search-input").value.trim();
  if (!q) return;
  searchFor(q);
}

async function searchFor(q) {
  document.getElementById("search-input").value = q;
  const listEl = document.getElementById("search-list");
  const statusEl = document.getElementById("search-status");
  listEl.innerHTML = '<div class="spinner"></div>';
  statusEl.textContent = "Connecting…";

  // Wake backend if needed
  const alive = await wakeBackend(msg => { statusEl.textContent = msg; });
  if (!alive) {
    statusEl.textContent = "Server unavailable. Please try again.";
    listEl.innerHTML = "";
    return;
  }

  statusEl.textContent = "Searching…";
  try {
    const res = await fetch(`${BASE}/songs/search?q=${encodeURIComponent(q)}`);
    const songs = await res.json();
    statusEl.textContent = songs.length ? `${songs.length} results` : "No results found";
    listEl.innerHTML = "";
    songs.forEach((s, i) => listEl.appendChild(makeSongCard(s, i, songs)));
  } catch(e) {
    statusEl.textContent = "Search failed. Check your connection.";
    listEl.innerHTML = "";
  }
}


// ── Song Card ──
function makeSongCard(song, idx, songList) {
  const dur = parseInt(song.duration) || 0;
  const durStr = dur ? `${Math.floor(dur/60)}:${String(dur%60).padStart(2,'0')}` : "";
  const isFav = favourites.some(f => f.id === song.id);
  const isPlaying = currentSong && currentSong.id === song.id;

  const card = document.createElement("div");
  card.className = "song-card" + (isPlaying ? " playing" : "");
  card.dataset.id = song.id;
  card.innerHTML = `
    <img class="song-thumb" src="${song.thumbnail}" alt="" loading="lazy" onerror="this.src=''" />
    <div class="song-info">
      <div class="song-title">${escHtml(song.title)}</div>
      <div class="song-artist">${escHtml(song.artist||"Unknown")}${durStr ? "  ·  "+durStr : ""}</div>
    </div>
    <button class="fav-btn ${isFav?"active":""}" title="Favourite" onclick="event.stopPropagation();toggleFavCard('${song.id}',this,${JSON.stringify(song).replace(/"/g,'&quot;')})">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="${isFav?"#f43f5e":"none"}" stroke="${isFav?"#f43f5e":"currentColor"}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  `;
  card.addEventListener("click", () => playSong(song, idx, songList));
  return card;
}

function escHtml(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Play ──
function playSong(song, idx, songList) {
  currentSong = song;
  queue = songList;
  qIndex = idx;

  // Update mini player
  document.getElementById("mini-thumb").src = song.thumbnail;
  document.getElementById("mini-title").textContent = song.title;
  document.getElementById("mini-artist").textContent = song.artist || "Unknown";
  document.getElementById("mini-player").classList.add("visible");

  // Update full player
  document.getElementById("full-thumb").src = song.thumbnail;
  document.getElementById("full-title").textContent = song.title;
  document.getElementById("full-artist").textContent = song.artist || "Unknown";

  // Fav state
  updateFavIcon();

  // Highlight playing card
  document.querySelectorAll(".song-card").forEach(c => {
    c.classList.toggle("playing", c.dataset.id === song.id);
  });

  // Show loading
  setLoading(true);

  // Load stream — use backend proxy (handles yt-dlp bot bypass internally)
  const url = `${BASE}/songs/stream/${song.id}`;
  audio.src = url;
  audio.load();
  audio.play()
    .then(() => setLoading(false))
    .catch(err => {
      console.warn('Autoplay blocked or failed:', err);
      setLoading(false);
      // Still show paused state — user can tap play
    });
}

function setLoading(v) {
  document.getElementById("loading-ring").style.display = v ? "block" : "none";
  document.getElementById("full-play-btn").style.display = v ? "none" : "flex";
}

function togglePlay() {
  if (!currentSong) return;
  if (audio.paused) audio.play(); else audio.pause();
}

function prevSong() {
  if (!queue.length) return;
  qIndex = (qIndex - 1 + queue.length) % queue.length;
  playSong(queue[qIndex], qIndex, queue);
}

function nextSong() {
  if (!queue.length) return;
  qIndex = (qIndex + 1) % queue.length;
  playSong(queue[qIndex], qIndex, queue);
}

// ── Audio Events ──
audio.addEventListener("play", () => {
  document.getElementById("mini-play-icon").innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  document.getElementById("full-play-icon").innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
});
audio.addEventListener("pause", () => {
  document.getElementById("mini-play-icon").innerHTML = '<path d="M8 5v14l11-7z"/>';
  document.getElementById("full-play-icon").innerHTML = '<path d="M8 5v14l11-7z"/>';
});
audio.addEventListener("ended", nextSong);
audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById("progress-bar").value = pct;
  document.getElementById("time-cur").textContent = fmtTime(audio.currentTime);
  document.getElementById("time-total").textContent = fmtTime(audio.duration);
});

function fmtTime(s) {
  s = Math.floor(s||0);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function seekTo(pct) {
  if (audio.duration) audio.currentTime = (pct/100) * audio.duration;
}

function setVolume(v) { audio.volume = v; }

// ── Full Player ──
function openFullPlayer() {
  const fp = document.getElementById("full-player");
  fp.style.display = "flex";
  requestAnimationFrame(() => fp.classList.add("open"));
}
function closeFullPlayer() {
  const fp = document.getElementById("full-player");
  fp.classList.remove("open");
  setTimeout(() => fp.style.display = "none", 350);
}

// ── Favourites ──
function toggleFavCard(id, btn, song) {
  const idx = favourites.findIndex(f => f.id === id);
  const isFav = idx === -1;
  if (isFav) favourites.push(song); else favourites.splice(idx,1);
  localStorage.setItem("musix_favs", JSON.stringify(favourites));
  const svg = btn.querySelector("svg");
  btn.classList.toggle("active", isFav);
  svg.setAttribute("fill", isFav ? "#f43f5e" : "none");
  svg.setAttribute("stroke", isFav ? "#f43f5e" : "currentColor");
  if (currentSong && currentSong.id === id) updateFavIcon();
}

function toggleFav() {
  if (!currentSong) return;
  const btn = document.createElement("button"); // dummy
  const idx = favourites.findIndex(f => f.id === currentSong.id);
  if (idx === -1) { favourites.push(currentSong); }
  else { favourites.splice(idx,1); }
  localStorage.setItem("musix_favs", JSON.stringify(favourites));
  updateFavIcon();
  // Also update cards
  document.querySelectorAll(`.fav-btn`).forEach(b => {
    const card = b.closest(".song-card");
    if (!card) return;
    const isFav = favourites.some(f => f.id === card.dataset.id);
    b.classList.toggle("active", isFav);
    const svg = b.querySelector("svg");
    svg.setAttribute("fill", isFav ? "#f43f5e" : "none");
    svg.setAttribute("stroke", isFav ? "#f43f5e" : "currentColor");
  });
}

function updateFavIcon() {
  if (!currentSong) return;
  const isFav = favourites.some(f => f.id === currentSong.id);
  const toggle = document.getElementById("fav-toggle");
  const icon = document.getElementById("fav-icon");
  toggle.classList.toggle("active", isFav);
  icon.setAttribute("fill", isFav ? "#f43f5e" : "none");
  icon.setAttribute("stroke", isFav ? "#f43f5e" : "currentColor");
}

function renderLibrary() {
  const listEl = document.getElementById("library-list");
  const empty = document.getElementById("library-empty");
  listEl.innerHTML = "";
  if (!favourites.length) { empty.style.display = "block"; return; }
  empty.style.display = "none";
  favourites.forEach((s, i) => listEl.appendChild(makeSongCard(s, i, favourites)));
}

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── Init ──
loadHome();
</script>
