name: Build Harmony Music APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Allows manual trigger from GitHub UI

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Build APK
        working-directory: app
        run: |
          buildozer android debug
        env:
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          ANDROIDNDK: ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r25b

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyMusic-debug
          path: app/bin/*.apk
          retention-days: 30
