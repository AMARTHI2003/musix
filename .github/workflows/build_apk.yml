name: Build Harmony Music APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Allows manual trigger from GitHub UI

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: master
          workdir: app

      - name: Upload Build Log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/.buildozer/android/platform/build-*/build.log*
          retention-days: 5

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyMusic-debug
          path: app/bin/*.apk
          retention-days: 30
